# Virtual host nginx per il sito di test del PoC.
# Sostituire test.example.org con il sottodominio reale e verificare i percorsi dei certificati.
# Basic auth: sudo htpasswd -c /etc/nginx/.htpasswd-gojuren <utente>   (pacchetto apache2-utils)

server {
    listen 80;
    listen [::]:80;
    server_name test.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name test.example.org;

    ssl_certificate     /etc/letsencrypt/live/test.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test.example.org/privkey.pem;

    root /var/www/gojuren-test;
    index index.html;

    # PoC privato: accesso con password e niente indicizzazione
    auth_basic           "PoC gojuren";
    auth_basic_user_file /etc/nginx/.htpasswd-gojuren;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Header di sicurezza comuni
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # CSP del sito pubblico (statico, nessuno script di terze parti)
    set $csp_site "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'";

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json text/plain;

    location / {
        add_header Content-Security-Policy $csp_site always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri $uri/ $uri.html =404;
    }

    # Pannello Sveltia: CSP più ampia (API GitHub, anteprime blob/data).
    # Se nella console del browser compaiono violazioni CSP, annotarle e allargare qui.
    location /admin/ {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.githubusercontent.com; media-src 'self' blob: data:; font-src 'self' data:; connect-src 'self' blob: data: https://api.github.com https://*.githubusercontent.com https://www.githubstatus.com; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /admin/index.html;
    }

    # Asset con hash (Astro) e media: cache lunga
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location /media/ {
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}
