# Verifica la raggiungibilità dei link elencati in legacy/checks/link.txt
# e salva l'esito in legacy/checks/esito.txt (parte quando cambia l'elenco o a mano).
name: Verifica link

on:
  push:
    branches: [main]
    paths: [legacy/checks/link.txt]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verifica
        run: |
          out=legacy/checks/esito.txt; : > "$out"
          while IFS= read -r url; do
            [ -z "$url" ] && continue
            res=$(curl -sS -L -o /dev/null --max-time 20 -A "Mozilla/5.0 (compatible; link-check)" \
                  -w '%{http_code} %{url_effective}' "$url" 2>&1 | tail -1)
            echo "$url -> $res" | tee -a "$out"
          done < legacy/checks/link.txt
          # pagina Overload Gym: serve l'HTML per trovare l'ancora del modulo "Prenota una prova gratuita"
          curl -sSL --max-time 30 -A "Mozilla/5.0" https://www.overloadgym.it/fitness/karate/ -o legacy/checks/overloadgym-karate.html || true
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add legacy/checks
          git diff --cached --quiet && exit 0
          git commit -m "Esito verifica link"
          git pull --rebase && git push
