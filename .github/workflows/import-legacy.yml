# Scarica dal vecchio sito gli asset elencati in legacy/assets.txt e li salva in legacy/raw/.
# Parte da solo quando cambia legacy/assets.txt, oppure a mano da Actions → Run workflow.
name: Import asset vecchio sito

on:
  push:
    branches: [main]
    paths: [legacy/assets.txt]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-legacy
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: python3 scripts/legacy/fetch.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add legacy/raw
          if git diff --cached --quiet; then echo "Nessuna novità"; exit 0; fi
          git commit -m "Import asset dal vecchio sito"
          git push
